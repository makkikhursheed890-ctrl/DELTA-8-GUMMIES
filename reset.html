<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f4f4f4; font-family: Arial, sans-serif; }
    .box { background: #fff; width: 92%; max-width: 400px; padding: 28px; border-radius: 12px;
           box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h2 { margin: 0 0 6px; }
    p.sub { margin: 0 0 16px; color: #666; font-size: 14px; word-break: break-all; }
    input { width: 100%; padding: 11px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #111; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 14px; min-height: 18px; }
    .err { color: #c00; }
    .ok { color: #198754; }
    a.back { display: inline-block; margin-top: 14px; color: #111; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Reset Password</h2>
    <p class="sub" id="sub">Link check ho raha hai...</p>

    <form id="resetForm" style="display:none">
      <input type="password" id="newPass" placeholder="New password (min 6)" minlength="6"
             autocomplete="new-password" required>
      <input type="password" id="newPass2" placeholder="Confirm new password" minlength="6"
             autocomplete="new-password" required>
      <button type="submit" id="resetBtn">Save New Password</button>
    </form>

    <p class="msg" id="msg"></p>
    <a class="back" id="backLink" href="index.html" style="display:none">Website par wapas jayein</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_qydbDcYURlx4NjhSsnxnrI-5mAFFRec",
      authDomain: "delta-8-gummies.firebaseapp.com",
      projectId: "delta-8-gummies",
      storageBucket: "delta-8-gummies.firebasestorage.app",
      messagingSenderId: "271896761472",
      appId: "1:271896761472:web:5745400dce7b732220c265",
      measurementId: "G-XEQRNRD24F"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const code = params.get("oobCode");
    const mode = params.get("mode");

    function show(text, ok) {
      $("msg").textContent = text;
      $("msg").className = "msg " + (ok ? "ok" : "err");
    }

    async function init() {
      if (!code || (mode && mode !== "resetPassword")) {
        $("sub").textContent = "";
        show("Ye link sahi nahi hai. Forgot password se naya link mangwayein.", false);
        $("backLink").style.display = "inline-block";
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth, code);
        $("sub").textContent = "Account: " + email;
        $("resetForm").style.display = "block";
      } catch (err) {
        console.error("VERIFY ERROR:", err.code, err.message);
        $("sub").textContent = "";
        show("Ye link expire ho chuka hai ya pehle use ho chuka hai. Naya link mangwayein.", false);
        $("backLink").style.display = "inline-block";
      }
    }

    $("resetForm").addEventListener("submit", async e => {
      e.preventDefault();
      const p1 = $("newPass").value, p2 = $("newPass2").value;
      if (p1 !== p2) { show("Dono password match nahi karte", false); return; }
      $("resetBtn").disabled = true;
      try {
        await confirmPasswordReset(auth, code, p1);
        $("resetForm").style.display = "none";
        $("sub").textContent = "";
        show("Password badal gaya! Ab naye password se Sign In karein.", true);
        $("backLink").style.display = "inline-block";
      } catch (err) {
        console.error("CONFIRM ERROR:", err.code, err.message);
        show(err.code === "auth/weak-password"
          ? "Password kam az kam 6 characters ka rakhein"
          : "Password badalne mein masla aaya, naya link mangwayein.", false);
        $("resetBtn").disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
